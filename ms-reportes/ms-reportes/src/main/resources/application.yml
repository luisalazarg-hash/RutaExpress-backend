server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: ms-reportes
  datasource:
    url: ${REPORTES_DB_URL}
    username: ${REPORTES_DB_USERNAME}
    password: ${REPORTES_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: optional:file:../../.env[.properties]
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  endpoints:
    web:
      exposure:
        include: health,info
