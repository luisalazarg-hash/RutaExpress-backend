server:
  port: ${SERVER_PORT:8082}
spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: ms-envios
  datasource:
    url: ${ENVIOS_DB_URL}
    username: ${ENVIOS_DB_USERNAME}
    password: ${ENVIOS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rutaexpress}
    password: ${RABBITMQ_PASSWORD:rutaexpress}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:rutaexpress.events}
    routing-key:
      created: ${RABBITMQ_ROUTING_KEY_CREATED:shipment.created}
      status-changed: ${RABBITMQ_ROUTING_KEY_STATUS_CHANGED:shipment.status.changed}
management:
  endpoints:
    web:
      exposure:
        include: health,info
