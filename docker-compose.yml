services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rutaexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rutaexpress} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rutaexpress}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rutaexpress}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-auth
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      AUTH_AZURE_TENANT_ID: ${AUTH_AZURE_TENANT_ID:-common}
      AUTH_AZURE_API_CLIENT_ID: ${AUTH_AZURE_API_CLIENT_ID:-local-placeholder}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  shipments:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-envios/ms-envios
    environment:
      ENVIOS_DB_URL: jdbc:postgresql://postgres:5432/shipments_db
      ENVIOS_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      ENVIOS_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-catalogo/ms-catalogo
    environment:
      CATALOGO_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOGO_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      CATALOGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-notificaciones/ms-notificaciones
    environment:
      SUPABASE_DB_URL: jdbc:postgresql://postgres:5432/notifications_db
      SUPABASE_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      SUPABASE_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-rutaexpress}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rutaexpress}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  audit:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-audit
    environment:
      AUDIT_DB_URL: jdbc:postgresql://postgres:5432/audit_db
      AUDIT_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      AUDIT_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  reports:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-reportes/ms-reportes
    environment:
      REPORTES_DB_URL: jdbc:postgresql://postgres:5432/reports_db
      REPORTES_DB_USERNAME: ${POSTGRES_USER:-rutaexpress}
      REPORTES_DB_PASSWORD: ${POSTGRES_PASSWORD:-rutaexpress_local}
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-admin:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-rabbitmq-admin
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-rutaexpress}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rutaexpress}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  kafka-admin:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE_PATH: ms-kafka-admin
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ../RutaExpress-BackForFront
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVICES_AUTH_URL: http://auth:8088
      SERVICES_SHIPMENTS_URL: http://shipments:8082
      SERVICES_CATALOG_URL: http://catalog:8081
      SERVICES_NOTIFICATIONS_URL: http://notifications:8083
      SERVICES_AUDIT_URL: http://audit:8084
      SERVICES_REPORTS_URL: http://reports:8085
      SERVICES_RABBITMQ_ADMIN_URL: http://rabbitmq-admin:8086
      SERVICES_KAFKA_ADMIN_URL: http://kafka-admin:8087
    depends_on:
      - auth
      - shipments
      - catalog
      - notifications
      - audit
      - reports
      - rabbitmq-admin
      - kafka-admin
    restart: unless-stopped

  frontend:
    build:
      context: ../RutaExpress-frontend
      args:
        VITE_API_URL: ""
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
        VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-}
    ports:
      - "5173:80"
    depends_on:
      - bff
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
