spring:
  application:
    name: ms-auth
  config:
    import: optional:file:../../.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AUTH_AZURE_TENANT_ID}/v2.0
  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8088
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  azure:
    api-client-id: ${AUTH_AZURE_API_CLIENT_ID}