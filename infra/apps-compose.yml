services:
  shipments:
    build: ../ms-envios
    ports: ["8082:8082"]
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  catalog:
    build: ../ms-catalogo
    ports: ["8081:8081"]
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
  notify:
    build: ../ms-notificaciones
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: rutaexpress
      RABBITMQ_PASSWORD: rutaexpress
  audit:
    build: ../ms-audit
    ports: ["8084:8084"]
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_DB_URL: ${AUDIT_DB_URL}
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
  report:
    build: ../ms-reportes
    ports: ["8085:8085"]
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REPORTES_DB_URL: ${REPORTES_DB_URL}
      REPORTES_DB_USERNAME: ${REPORTES_DB_USERNAME}
      REPORTES_DB_PASSWORD: ${REPORTES_DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
  rabbitmq-admin:
    build: ../ms-rabbitmq-admin
    ports: ["8086:8086"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: rutaexpress
      RABBITMQ_PASSWORD: rutaexpress
  kafka-admin:
    build: ../ms-kafka-admin
    ports: ["8087:8087"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  bff:
    build: ../../RutaExpress-BackForFront
    ports: ["8080:8080"]
    depends_on:
      - shipments
      - catalog
      - notify
      - audit
      - report
      - rabbitmq-admin
      - kafka-admin
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      SERVICES_SHIPMENTS_URL: http://shipments:8082
      SERVICES_CATALOG_URL: http://catalog:8081
      SERVICES_NOTIFICATIONS_URL: http://notify:8083
      SERVICES_AUDIT_URL: http://audit:8084
      SERVICES_REPORTS_URL: http://report:8085
      SERVICES_RABBITMQ_ADMIN_URL: http://rabbitmq-admin:8086
      SERVICES_KAFKA_ADMIN_URL: http://kafka-admin:8087
